
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Peminjaman Alat</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-gray-100 min-h-screen">
<header class="bg-blue-600 text-white px-4 sm:px-5 py-3 sm:py-4 flex justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <button id="tombolMenu" onclick="toggleMenu()" class="md:hidden text-white text-2xl leading-none focus:outline-none" aria-label="Buka menu navigasi">
                &#9776;
            </button>
            <h1 class="text-xl font-bold">PEMINJAMAN ALAT</h1>
        </div>
        <div class="flex flex-wrap justify-end items-center gap-2 sm:gap-4">
            <span id="namaUser"></span>
           
        </div>
    </header>

    <div class="flex flex-col md:flex-row min-h-[calc(100vh-72px)]">
        <aside id="sidebarMenu" class="hidden md:block w-full md:w-56 bg-white border-b-2 md:border-b-0 md:border-r-2 border-blue-800 flex-shrink-0">
            <nav class="block">
                
                <a href="alat.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                     DATA ALAT
                </a>
                <a href="datapinjaman.html" id="menuPengguna" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    DATA PEMINJAMAN
                </a>
                <a href="kategori.html" id="menuKategori" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    KATEGORI
                </a>
                <a href="tambahpinjaman.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    TAMBAHKAN PEMINJAMAN
                </a>
                <a href="tambahalat.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    TAMBAHKAN ALAT
                </a>
                
            </nav>
        </aside>
<main class="flex-1 p-4 sm:p-6 min-w-0">
            <h2 class="text-2xl sm:text-3xl font-bold mb-5">Kategori Alat</h2>

          

            <div class="bg-white border border-gray-300 rounded-lg p-3 sm:p-4 overflow-x-auto shadow-md shadow-md hover:-translate-y-1 hover:shadow-lg duration-300">
                <table class="w-full border-collapse ">
                    <thead>
                        <tr class="bg-gray-200">
                         
                            <th class="border p-2">Id Kategori</th>
                            <th class="border p-2">Nama Kategori</th>
                            <th class="border p-2">Deskripsi</th>
                        </tr>
                    </thead>
                    <tbody id="kategori-list" class="divide-y divide-gray-100">

<tr>
<td colspan="4" class="py-4 px-6 text-center text-gray-500">Memuat
data kategori...</td>
</tr></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalKategori" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center px-4">
        <div class="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <h3 id="judulKategori" class="text-xl font-bold mb-4">Tambah Kategori</h3>

            <form id="kategoriForm" class="space-y-4">
                <input type="hidden" id="indexKategori">

                <input type="text" id="namaKategori" placeholder="Nama Kategori"
                    class="w-full border p-2 rounded" required>

                <textarea id="deskripsiKategori" placeholder="Deskripsi kategori"
                    class="w-full border p-2 rounded"></textarea>

                <div class="flex flex-col-reverse sm:flex-row justify-end gap-2">
                    <button type="button" onclick="tutupKategori()" class="border px-4 py-2 rounded">
                        Batal
                    </button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
