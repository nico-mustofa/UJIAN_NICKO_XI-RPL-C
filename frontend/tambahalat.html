<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Peminjaman Alat</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-600 text-white px-4 sm:px-5 py-3 sm:py-4 flex justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <button id="tombolMenu" onclick="toggleMenu()"
                class="md:hidden text-white text-2xl leading-none focus:outline-none" aria-label="Buka menu navigasi">
                &#9776;
            </button>
            <h1 class="text-xl font-bold">PEMINJAMAN ALAT</h1>
        </div>
        <div class="flex flex-wrap justify-end items-center gap-2 sm:gap-4">
            <span id="namaUser"></span>
        </div>
    </header>
    <div class="flex flex-col md:flex-row min-h-[calc(100vh-72px)]">
        <aside id="sidebarMenu"
            class="hidden md:block w-full md:w-56 bg-white border-b-2 md:border-b-0 md:border-r-2 border-blue-800 flex-shrink-0">
            <nav class="block">
                <a href="alat.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    DATA ALAT
                </a>
                <a href="#" id="menuPengguna"
                    class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    DATA PEMINJAMAN
                </a>
                <a href="kategori.html" id="menuKategori"
                    class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    KATEGORI
                </a>
                <a href="tambahpinjaman.html"
                    class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    TAMBAHKAN PEMINJAMAN
                </a>
                <a href="tambahalat.html"
                    class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 font-bold text-l">
                    TAMBAHKAN ALAT
                </a>
            </nav>
        </aside>

        <div id="modalProduk" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center px-4">
            <div class="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-lg">
                <h3 id="judulForm" class="text-xl font-bold mb-4">Tambah Produk</h3>
                <form id="produkForm" class="space-y-4">
                    <input type="hidden" id="indexProduk">
                    <input type="text" id="namaProduk" placeholder="Nama Produk"
                        class="w-full border p-2 rounded hover:border-blue-500 duration-200" required>
                    <select id="kategoriProduk" class="w-full border p-2 rounded hover:border-blue-500 duration-200"
                        required></select>
                    <input type="number" id="jumlahProduk" placeholder="Jumlah" min="0"
                        class="w-full border p-2 rounded hover:border-blue-500 duration-200" required>
                    <input type="number" id="hargaProduk" placeholder="Harga" min="0"
                        class="w-full border p-2 rounded hover:border-blue-500 duration-200" required>
                    <div class="flex flex-col-reverse sm:flex-row justify-end gap-2">
                        <button type="button" onclick="tutupForm()"
                            class="border px-4 py-2 rounded hover:bg-gray-200 duration-200">Batal</button>
                        <button type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 duration-200">Simpan</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modalBeli" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center px-4">
            <div class="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-lg">
                <h3 class="text-xl font-bold mb-4">Tambah ke Keranjang</h3>
                <p id="infoBeli" class="mb-4"></p>
                <label for="jumlahBeli" class="block mb-1">Jumlah</label>
                <input type="number" id="jumlahBeli" min="1"
                    class="w-full border p-2 rounded mb-4 hover:border-blue-500 duration-200">
                <div class="flex flex-col-reverse sm:flex-row justify-end gap-2">
                    <button onclick="tutupBeli()"
                        class="border px-4 py-2 rounded hover:bg-gray-200 duration-200">Batal</button>
                    <button onclick="tambahKeKeranjang()"
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 duration-200">Tambah</button>
                </div>
            </div>
        </div>

        <div id="modalKeranjang" class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center px-4">
            <div class="bg-white rounded-lg p-6 w-full max-w-2xl shadow-lg max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Keranjang Belanja</h3>
                    <button onclick="tutupKeranjang()"
                        class="text-gray-500 text-xl hover:text-black duration-200">&times;</button>
                </div>
                <div id="isiKeranjang"></div>
                <div class="border-t mt-4 pt-4 flex flex-col sm:flex-row gap-3 justify-between items-center">
                    <div>
                        <p class="text-gray-500">Total</p>
                        <p id="totalKeranjang" class="text-xl font-bold">Rp0</p>
                    </div>
                    <button id="tombolPesan" onclick="pesanSekarang()"
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 duration-200">
                        Pesan Sekarang
                    </button>
                </div>
                <p id="pesanKeranjang" class="text-sm mt-3"></p>
            </div>
        </div>

        <div id="formBox" class="w-full bg-slate-50 border border-slate-200 p-4 mb-6 rounded">
            <form id="formTambah" class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                <div>
                    <label class="block text-xs text-slate-500 mb-1" for="ID ALAT">Nama Kategori</label>
                    <select id="ID ALAT" required class="w-full border px-3 py-2 rounded text-sm bg-white">
                        <option value="">-- Pilih Kategori --</option>
                        <option value="1">Komputer & Jaringan</option>
                        <option value="2">Multimedia</option>
                        <option value="3">Elektronika</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-500 mb-1" for="NAMA ALAT">Nama Alat</label>
                    <input id="NAMA ALAT" required type="text" placeholder="Nama Alat"
                           class="w-full border px-3 py-2 rounded text-sm">
                </div>

                <div>
                    <label class="block text-xs text-slate-500 mb-1" for="KONDISI">Kondisi</label>
                    <input id="KONDISI" required type="text" placeholder="Kondisi"
                           class="w-full border px-3 py-2 rounded text-sm">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs text-slate-500 mb-1" for="STOK">Stok</label>
                    <input id="STOK" type="number" required min="0" placeholder="Stok"
                           class="w-full border px-3 py-2 rounded text-sm bg-white">
                </div>

                <div>
                    <label class="block text-xs text-slate-500 mb-1" for="LOKASI">Lokasi</label>
                    <input id="LOKASI" required type="text" placeholder="Lokasi"
                           class="w-full border px-3 py-2 rounded text-sm">
                </div>

                <div class="sm:col-span-2 flex gap-3">
                    <button type="submit"
                            class="border px-4 py-2 rounded text-sm hover:bg-slate-100 transition">
                        Tambah
                    </button>
                    <button type="button" onclick="tutupForm()"
                            class="border px-4 py-2 rounded text-sm hover:bg-slate-100 transition">
                        Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const formTambahAlat = document.getElementById('formTambah');
        formTambahAlat.addEventListener('submit', async function (event) {
            event.preventDefault();

            const dataAlat = {
                id_kategori: Number(document.getElementById('ID ALAT').value),
                nama_alat: document.getElementById('NAMA ALAT').value,
                kondisi: document.getElementById('KONDISI').value,
                stok: Number(document.getElementById('STOK').value),
                lokasi: document.getElementById('LOKASI').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/alat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataAlat)
                });

                const result = await response.json();

                if (response.status === 201) {
                    alert('Berhasil: ' + result.message);
                    formTambahAlat.reset();
                    location.reload();
                } else {
                    alert('Gagal: ' + result.message);
                }
            } catch (error) {
                alert('Koneksi gagal. Pastikan backend aktif.');
            }
        });
    </script>
</body>
</html>
